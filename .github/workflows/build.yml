name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SyntaxCircus.AspNetCore.IndexNow.slnx
      - run: dotnet build SyntaxCircus.AspNetCore.IndexNow.slnx --no-restore --configuration Release
      - run: dotnet test SyntaxCircus.AspNetCore.IndexNow.slnx --no-build --configuration Release
      - run: dotnet pack SyntaxCircus.AspNetCore.IndexNow.slnx --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.*nupkg
          retention-days: 7
